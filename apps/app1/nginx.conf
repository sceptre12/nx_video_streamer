server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker embedded DNS; variable proxy_pass resolves at request time so
  # `nginx -t` passes in a container started alone.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location / {
    try_files $uri /index.html;
  }

  location /api/ {
    set $api_upstream http://app-server:3002;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    # strip client-sent identity headers
    proxy_set_header X-User-Id "";
    proxy_set_header X-Forwarded-User "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  location /socket.io/ {
    set $ws_upstream http://db-server:3001;
    proxy_pass $ws_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # strip client-sent identity headers
    proxy_set_header X-User-Id "";
    proxy_set_header X-Forwarded-User "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
}
